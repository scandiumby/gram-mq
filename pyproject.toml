[project]
name = "gram-mq"
version = "0.1.0"
description = "Outbound Telegram message queue proxy"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "coverage",
]

[project.scripts]
test = "gram_mq.devtools:test"
lint = "gram_mq.devtools:lint"
typecheck = "gram_mq.devtools:typecheck"
check = "gram_mq.devtools:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gram_mq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = [".specify", "specs", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true

[tool.coverage.run]
source = ["gram_mq"]

[tool.coverage.report]
fail_under = 80
